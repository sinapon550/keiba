const b2a=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(){
  const err=document.getElementById('err'); err.textContent='';
  const pw=document.getElementById('pw').value;
  try{
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b2a(SALT),iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV),tagLength:128},key,b2a(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){ err.textContent='合言葉が違います'; }
}
document.getElementById('go').onclick=open_;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open_();});
document.getElementById('pw').focus();
</script>
