    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV),tagLength:128},key,b2a(CT));
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){ err.textContent='合言葉が違います'; }
}
document.getElementById('go').onclick=open_;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')open_();});
document.getElementById('pw').focus();
</script>
